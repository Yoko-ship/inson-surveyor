name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node --check surveyor/static/app.js
      - run: node --check surveyor/static/i18n.js
      - run: node --check surveyor/static/source_setup.js
      - run: node --check surveyor/static/factor_pricing.js
      - run: node --check surveyor/static/factors.js
      - run: node --check surveyor/static/tariff_policy.js
      - run: node --check surveyor/static/codex_pilot.js
      - run: node --check surveyor/static/ai_text.js
      - run: node --check surveyor/static/inspection_ai.js
      - run: node --check surveyor/static/assistant.js
      - run: uv run python scripts/public_database.py check
      - run: uv run pytest --cov=surveyor --cov-report=term-missing
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/check_secrets.py --history
      - run: uv run pip-audit
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: surveyor
          POSTGRES_DB: surveyor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surveyor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://surveyor:ci-only@localhost:5432/surveyor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -c "from surveyor.bootstrap import bootstrap; bootstrap()"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: POSTGRES_PASSWORD=ci-only APP_DOMAIN=example.invalid docker compose -f compose.yaml -f deploy/compose.https.yaml config --quiet
      - run: docker build -t surveyor:test .
      - run: docker run --rm surveyor:test codex --version
      - run: docker run --rm surveyor:test sh -c 'alembic upgrade head && alembic check'
