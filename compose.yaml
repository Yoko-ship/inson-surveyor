services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: surveyor
      POSTGRES_USER: surveyor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyor"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://surveyor:${POSTGRES_PASSWORD}@db:5432/surveyor
      STORAGE_DIR: /app/data/uploads
      PORT: 8000
    ports: ["127.0.0.1:8010:8000"]
    volumes: ["uploads:/app/data", "codex:/home/surveyor/.codex"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  sources:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://surveyor:${POSTGRES_PASSWORD}@db:5432/surveyor
      STORAGE_DIR: /app/data/uploads
    volumes: ["uploads:/app/data"]
    command: ["python", "scripts/run_worker.py"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  ai:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://surveyor:${POSTGRES_PASSWORD}@db:5432/surveyor
      STORAGE_DIR: /app/data/uploads
    volumes: ["uploads:/app/data", "codex:/home/surveyor/.codex"]
    command: ["python", "scripts/run_ai_worker.py"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  uploads:
  codex:
