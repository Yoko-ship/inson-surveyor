[project]
name = "surveyor"
version = "0.1.0"
description = "Deterministic insurance surveying platform and Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.3.6,<4", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20", "argon2-cffi>=23.1", "httpx>=0.28,<1",
  "pypdf>=6,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "reportlab>=4.3,<5", "pillow>=11,<13", "defusedxml>=0.7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11", "pip-audit>=2.9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
